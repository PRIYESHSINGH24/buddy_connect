services:
  # ─── Nginx Load Balancer ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: buddy-connect-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    networks:
      - buddy-network
    restart: unless-stopped

  # ─── Next.js App Instance 1 ──────────────────────────────────────
  app1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buddy-connect-app1
    environment: &app-env
      - DATABASE_URL=postgresql://${POSTGRES_USER:-buddy}:${POSTGRES_PASSWORD:-buddy123}@postgres:5432/${POSTGRES_DB:-buddy_connect}?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-dev-jwt-secret-key-change-in-production-123}
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Redis
      - UPSTASH_REDIS_REST_URL=${UPSTASH_REDIS_REST_URL:-}
      - UPSTASH_REDIS_REST_TOKEN=${UPSTASH_REDIS_REST_TOKEN:-}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # Pusher
      - PUSHER_APP_ID=${PUSHER_APP_ID:-}
      - PUSHER_KEY=${PUSHER_KEY:-}
      - PUSHER_SECRET=${PUSHER_SECRET:-}
      - PUSHER_CLUSTER=${PUSHER_CLUSTER:-}
      - NEXT_PUBLIC_PUSHER_KEY=${NEXT_PUBLIC_PUSHER_KEY:-}
      - NEXT_PUBLIC_PUSHER_CLUSTER=${NEXT_PUBLIC_PUSHER_CLUSTER:-}
      # Cloudflare R2
      - R2_ACCOUNT_ID=${R2_ACCOUNT_ID:-}
      - R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}
      - R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}
      - R2_BUCKET_NAME=${R2_BUCKET_NAME:-}
      - R2_PUBLIC_URL=${R2_PUBLIC_URL:-}
      # AI
      - AI_GATEWAY_API_KEY=${AI_GATEWAY_API_KEY:-}
      - AI_TIMEOUT_MS=${AI_TIMEOUT_MS:-15000}
      # Email
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - EMAIL_FROM=${EMAIL_FROM:-noreply@buddyconnect.app}
      # LinkedIn OAuth
      - LINKEDIN_CLIENT_ID=${LINKEDIN_CLIENT_ID:-}
      - LINKEDIN_CLIENT_SECRET=${LINKEDIN_CLIENT_SECRET:-}
      - LINKEDIN_REDIRECT_URI=${LINKEDIN_REDIRECT_URI:-}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - buddy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',(r)=>{r.resume();r.on('end',()=>{process.exit(r.statusCode>=400?1:0)})}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 384M

  # ─── Next.js App Instance 2 ──────────────────────────────────────
  app2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buddy-connect-app2
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - buddy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/',(r)=>{r.resume();r.on('end',()=>{process.exit(r.statusCode>=400?1:0)})}).on('error',()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.5'
          memory: 384M

  # ─── BullMQ Worker ───────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: buddy-connect-worker
    command: ["pnpm", "dlx", "tsx", "scripts/worker.ts"]
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - buddy-network
    restart: unless-stopped
    healthcheck:
      disable: true
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 384M

  # ─── Redis ────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: buddy-connect-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - buddy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ─── PostgreSQL (development) ────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: buddy-connect-postgres
    ports:
      - "5432:5432"
    # More headroom for concurrent app connections (default max_connections=100)
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-buddy}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-buddy123}
      - POSTGRES_DB=${POSTGRES_DB:-buddy_connect}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - buddy-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-buddy} -d ${POSTGRES_DB:-buddy_connect}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  buddy-network:
    driver: bridge